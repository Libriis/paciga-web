<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paciga — diagnostika</title>
<style>
  body { background: #0c0d0f; color: #f5f5f5; font-family: system-ui, sans-serif; padding: 40px; line-height: 1.7; }
  h1 { color: #d8b56e; font-size: 22px; }
  .ok { color: #3ddc84; } .bad { color: #ff6b6b; font-weight: 700; }
  li { font-size: 16px; }
  #note { margin-top: 20px; color: #aaa; }
</style>
</head>
<body>
<h1>Diagnostika 3D vrstvy</h1>
<ul id="out"></ul>
<div id="note">Výsledky sa automaticky odoslali Claudovi. Toto okno môžeš zavrieť.</div>
<script type="importmap">{"imports":{"three":"./assets/vendor/three.module.min.js"}}</script>
<script type="module">
const R = { ua: navigator.userAgent, dpr: window.devicePixelRatio, vw: innerWidth, vh: innerHeight, ts: new Date().toISOString() };
const out = document.getElementById('out');
function row(name, ok, detail) {
  R[name] = { ok: ok, detail: detail || '' };
  const li = document.createElement('li');
  li.innerHTML = name + ': <span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'OK' : 'PROBLÉM') + '</span> <small>' + (detail || '') + '</small>';
  out.appendChild(li);
}

row('reducedMotion_vypnute', !(matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches),
  matchMedia('(prefers-reduced-motion: reduce)').matches ? 'Windows/prehliadač má vypnuté animácie — 3D vrstva sa schválne nespúšťa' : 'animácie povolené');

row('importmap', !!(HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')));

let gl = null, glName = '';
try {
  const c = document.createElement('canvas');
  gl = c.getContext('webgl2') || c.getContext('webgl');
  if (gl) { const d = gl.getExtension('WEBGL_debug_renderer_info'); glName = d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) : 'renderer skrytý'; }
} catch (e) { glName = e.message; }
row('webgl', !!gl, glName);

let alphaOk = false;
try {
  const c2 = document.createElement('canvas');
  const g2 = c2.getContext('webgl2', { alpha: true }) || c2.getContext('webgl', { alpha: true });
  alphaOk = !!g2 && g2.getContextAttributes().alpha === true;
} catch (e) {}
row('webgl_alpha', alphaOk);

try {
  const THREE = await import('three');
  row('three_module', true, 'rev ' + THREE.REVISION);
  try {
    const cv = document.createElement('canvas');
    const r = new THREE.WebGLRenderer({ canvas: cv, alpha: true, antialias: true });
    row('three_renderer', true, 'vytvorený');
    r.dispose();
  } catch (e) { row('three_renderer', false, e.message); }
  try {
    const tex = await new Promise((res, rej) => new THREE.TextureLoader().load('assets/feather.png', res, undefined, rej));
    row('feather_textura', true, tex.image.width + 'x' + tex.image.height);
  } catch (e) { row('feather_textura', false, 'nepodarilo sa načítať assets/feather.png'); }
} catch (e) {
  row('three_module', false, e.message);
}

row('mix_blend_screen', CSS.supports && CSS.supports('mix-blend-mode', 'screen'));

fetch('/__diag', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(R) })
  .catch(function () { document.getElementById('note').textContent = 'Odoslanie reportu zlyhalo — odfoť túto obrazovku.'; });
</script>
</body>
</html>
